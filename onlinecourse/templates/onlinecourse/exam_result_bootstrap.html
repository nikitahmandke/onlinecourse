<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <title>Exam Result</title>
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Home</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                {% if user.is_authenticated %}
                <li>
                    <a class="btn btn-link" href="#">{{ user.username }}</a>
                    <a class="btn btn-link" href="{% url 'onlinecourse:logout' %}">Logout</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Result Banner -->
        <div class="alert alert-success mt-3" role="alert">
            <h4 class="alert-heading">Congratulations! You have passed the exam.</h4>
            <p>Your score: <strong>100 / 100</strong></p>
        </div>

        <!-- Exam Details -->
        <h3 class="mt-4">Exam results</h3>
        
        <div class="card mt-3">
            <div class="card-header">
                <strong>What is Django?</strong> (100 points)
            </div>
            <div class="card-body">
                <p class="text-success font-weight-bold">
                    <span class="badge badge-success">Correct</span> A Python Web Framework
                </p>
                <p class="text-muted">
                    A Database
                </p>
            </div>
        </div>
        
        <div class="mt-4">
            <a class="btn btn-primary" href="{% url 'onlinecourse:index' %}">Back to Course List</a>
        </div>
    </div>
</body>
</html>
